# Canonical Krateo OCI package-build workflow — THE single way every krateo-* repo builds
# and publishes Helm packages. Identical byte-for-byte across ALL repos (no per-repo config):
# it is fully shape-agnostic and discovers what to publish from the repo layout itself.
#
# What it publishes: every FIRST-CLASS chart in the repo — any directory containing a
# Chart.yaml that is NOT a vendored subchart (i.e. not sitting in some other chart's
# charts/ directory). That covers every layout in the org with one rule:
#   • single-chart repos:  chart/  crds-subchart/  target-chart/  kagent/chart/
#   • multi-chart repos:   charts/*            (each immediate child is first-class)
#   • vendored deps:       chart/charts/<dep>  (SKIPPED — grandparent is itself a chart)
#
# How versions are set (a chart opts in purely by which placeholders it authors):
#   • CHART_VERSION → the release tag (or workflow_dispatch input)
#   • SOURCE_REF    → the release tag           (federated agents pin their source to it)
#   • APP_VERSION   → latest semver tag of the application repo (the deployed image tag),
#                     auto-derived as <org>/<repo minus -chart suffix>; a no-op for charts
#                     that ship no image (no APP_VERSION placeholder) or whose app repo
#                     has no tags.
# A chart with none of these placeholders keeps its own literally-pinned versions untouched.
#
# Collision guard: refuses to push unless OCI_REPO carries a chart-namespace path segment,
# so a chart named e.g. `frontend` can never collide with a same-named container image at
# the registry root. Universal, harmless for every repo.
#
# The same bytes are then published to the Marketplace index by the organisation's one publisher
# (krateo-blueprints/charts PUBLISHING.md). hyperdx-provider has values.schema.json but no
# CompositionDefinition of its own, so it is not a blueprint and goes to the `operators` channel.
# The standard also requires the chart version to come from the tag (rule 4), so a chart here
# that pins a literal version is refused below rather than republished under an old number.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false

permissions:
  contents: read
  packages: write
  actions: read # the lint-run check reads this repository's workflow runs

env:
  OCI_REPO: oci://ghcr.io/krateo-blueprints/charts

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Refuse to release a commit no lint run ever passed on (PUBLISHING.md rule 10). A quiet
      # check list reads as success, so the never-triggered case is made loud here, the last point
      # before the charts are published. This asserts only what it can see: that THIS commit has a
      # concluded, successful run of lint.yaml. lint.yaml runs on pushes to main, so a merged
      # commit has one; a squash merge's history does not record what ran on the branch.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/lint.yaml/runs?head_sha=${SHA}&per_page=100"
          runs="$(gh api "$runs_url" --jq '[.workflow_runs[] | select(.status == "completed")] | length')"
          ok="$(gh api "$runs_url" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "lint runs on ${SHA}: ${runs} completed, ${ok} successful"
          if [ "$runs" -eq 0 ]; then
            echo "::error::No completed lint run exists for ${SHA}. This is the never-triggered case, not"
            echo "::error::a pending one. Dispatch lint.yaml on this commit, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::lint ran on ${SHA} but never succeeded. Refusing to publish."
            exit 1
          fi

      # The Marketplace installs what the helm index at krateo-blueprints/charts lists, not what
      # GHCR holds, and the publish-index job below needs this secret to get there. Refuse here,
      # before anything is pushed, so a missing token fails the release instead of leaving GHCR
      # and the index at different versions (PUBLISHING.md rules 1 and 7).
      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release could not reach the"
            echo "::error::Marketplace index and the Marketplace would keep installing an old version."
            exit 1
          fi

      # Collision guard: require a chart-namespace path segment under host/org (e.g. .../krateo).
      # A bare registry root (oci://ghcr.io/<org>) would push a chart named <X> to
      # ghcr.io/<org>/<X> and collide with a same-named container image. Fail fast.
      - name: Assert chart-namespaced OCI_REPO (no registry-root push)
        run: |
          path="${OCI_REPO#oci://}"
          segs="$(printf '%s' "$path" | tr '/' '\n' | grep -c .)"
          if [ "$segs" -lt 3 ]; then
            echo "::error::OCI_REPO='${OCI_REPO}' is the registry root (${segs} path segments)."
            echo "::error::Use a chart-namespaced repo, e.g. oci://ghcr.io/krateo-blueprints/charts."
            exit 1
          fi

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION_INPUT: ${{ github.event.inputs.chart_version }}
          APP_VERSION_INPUT: ${{ github.event.inputs.app_version }}
        run: |
          set -euo pipefail
          CHART_VERSION="${CHART_VERSION_INPUT:-${GITHUB_REF_NAME}}"
          # App repo by convention: <org>/<this repo with any -chart suffix stripped>.
          APP_REPO="${GITHUB_REPOSITORY%-chart}"
          if [ -n "${APP_VERSION_INPUT}" ]; then
            APP_VERSION="${APP_VERSION_INPUT}"
          else
            APP_VERSION="$(gh api "repos/${APP_REPO}/tags" --paginate --jq '.[].name' 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved: CHART_VERSION=${CHART_VERSION}  APP_VERSION=${APP_VERSION:-<none>}  (APP_REPO=${APP_REPO})"

      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Discover, version, package & push every first-class chart
        env:
          CHART_VERSION: ${{ steps.ver.outputs.chart_version }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          set -euo pipefail

          # Discover first-class charts: a Chart.yaml is a vendored subchart (SKIP) iff its
          # parent dir is named `charts` AND its grandparent is itself a chart. Everything
          # else is first-class and gets published.
          charts=()
          while IFS= read -r cf; do
            d="$(dirname "$cf")"
            parent="$(dirname "$d")"
            if [ "$(basename "$parent")" = "charts" ] && [ -f "$(dirname "$parent")/Chart.yaml" ]; then
              continue
            fi
            charts+=("$d")
          done < <(find . -name Chart.yaml | sort)

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::no first-class charts found"; exit 1
          fi
          echo "First-class charts: ${charts[*]}"

          mkdir -p dist
          for d in "${charts[@]}"; do
            echo "::group::package ${d}"
            # Opt-in placeholder substitution (untouched if a placeholder is absent).
            sed -i "s/CHART_VERSION/${CHART_VERSION}/g; s/SOURCE_REF/${CHART_VERSION}/g" "${d}/Chart.yaml"
            if [ -n "${APP_VERSION}" ]; then
              sed -i "s/APP_VERSION/${APP_VERSION}/g" "${d}/Chart.yaml"
            fi
            if grep -q '^dependencies:' "${d}/Chart.yaml"; then
              helm dependency build "${d}" >/dev/null 2>&1 || helm dependency update "${d}" >/dev/null 2>&1 || true
            fi
            helm package "${d}" -d dist/
            echo "::endgroup::"
          done

          # Versions come from the tag (PUBLISHING.md rule 4). A Chart.yaml with a literal version
          # packages that literal whatever the tag says: hyperdx-provider pinned 0.1.2, so tag
          # 0.1.3 rebuilt 0.1.2. Refuse before anything is pushed.
          for tgz in dist/*.tgz; do
            case "$(basename "$tgz")" in
              *"-${CHART_VERSION}.tgz") : ;;
              *)
                echo "::error::$(basename "$tgz") is not version ${CHART_VERSION}; its Chart.yaml must carry version: CHART_VERSION"
                exit 1 ;;
            esac
          done

          # Refuse here, before GHCR holds the version, every archive the Marketplace index's publisher
          # would refuse after it (PUBLISHING.md rules 2 and 3): the same checks, on the same archive.
          # helm package exits 0 whether or not a file made it into the chart, so the archive is what is
          # checked. Listings are read once and matched with here-strings: `tar | grep -q` under
          # pipefail fails on SIGPIPE when grep matches early.
          gate() {
            local name="$1" tgz="$2" channel="$3" members chart_yaml chart_ver src want kind f
            local cd_yaml cd_url cd_ver
            members="$(tar tzf "$tgz")"
            chart_yaml="$(tar -xzOf "$tgz" "${name}/Chart.yaml")"
            chart_ver="$(yq -r '.version' <<< "$chart_yaml")"
            src="https://github.com/${GITHUB_REPOSITORY}"
            if ! yq -e ".sources // [] | .[] | select(. == \"${src}\")" <<< "$chart_yaml" >/dev/null 2>&1; then
              echo "::error::${name}: Chart.yaml sources: must list ${src}, the repository that builds it"
              return 1
            fi
            if [ "$channel" != operators ]; then
              for f in values.schema.json compositiondefinition.yaml; do
                if ! grep -qxF "${name}/${f}" <<< "$members"; then
                  echo "::error::$(basename "$tgz") lacks ${name}/${f}"
                  return 1
                fi
              done
            fi
            want=operators
            if grep -qxF "${name}/values.schema.json" <<< "$members" \
               && grep -qxF "${name}/compositiondefinition.yaml" <<< "$members"; then
              kind="$(yq -r '.annotations."krateo.io/kind" // ""' <<< "$chart_yaml")"
              if [ "$kind" = page-set ]; then want=pages; else want=blueprints; fi
            fi
            if [ "$want" != "$channel" ]; then
              echo "::error::${name}: its archive belongs in ${want}, not ${channel} (PUBLISHING.md rule 2)"
              return 1
            fi
            if [ "$channel" = operators ]; then
              return 0
            fi
            cd_yaml="$(tar -xzOf "$tgz" "${name}/compositiondefinition.yaml")"
            cd_url="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.url' <<< "$cd_yaml")"
            cd_ver="$(yq -r 'select(.kind == "CompositionDefinition") | .spec.chart.version' <<< "$cd_yaml")"
            if [ "$cd_url" != "oci://ghcr.io/krateo-blueprints/charts/${name}" ]; then
              echo "::error::${name}: its CompositionDefinition installs '${cd_url}', not oci://ghcr.io/krateo-blueprints/charts/${name}"
              return 1
            fi
            if [ "$cd_ver" != "$chart_ver" ]; then
              echo "::error::${name} ${chart_ver}: its CompositionDefinition installs version '${cd_ver}' (PUBLISHING.md rule 4)"
              return 1
            fi
            case "$(yq -r '.icon // ""' <<< "$chart_yaml")" in
              https://*) : ;;
              *) echo "::error::${name}: Chart.yaml icon must be an absolute https URL"; return 1 ;;
            esac
            if [ "$(yq -r '(.keywords // []) | length' <<< "$chart_yaml")" -eq 0 ]; then
              echo "::error::${name}: Chart.yaml needs keywords, the Marketplace's tags"
              return 1
            fi
          }

          # hyperdx-provider is an operator (see the header); the gate refuses an archive that
          # says otherwise, or one the index would refuse, before anything is pushed.
          for tgz in dist/*.tgz; do
            gate "$(basename "$tgz" "-${CHART_VERSION}.tgz")" "$tgz" operators || exit 1
          done

          for tgz in dist/*.tgz; do
            echo "Pushing ${tgz} -> ${OCI_REPO}"
            helm push "${tgz}" "${OCI_REPO}"
          done

      # The same bytes that went to GHCR, for the index.
      - name: Hand the tarballs to the index job
        uses: actions/upload-artifact@v4
        with:
          name: charts-dist
          path: dist/*.tgz
          if-no-files-found: error

  # The Marketplace reads https://krateo-blueprints.github.io/charts/operators/index.yaml for charts
  # that are not blueprints. How every chart in the organisation gets there is decided once, in
  # krateo-blueprints/charts PUBLISHING.md, and enforced by its publisher, which also reads the
  # served index and installs each chart anonymously before it succeeds.
  publish-index:
    needs: package-and-push
    # Pinned by full commit SHA (PUBLISHING.md rule 9); Dependabot proposes upgrades.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@a2d63ba50e138b17f678528d6d6be3afef48715a # 1.0.0
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: operators
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
