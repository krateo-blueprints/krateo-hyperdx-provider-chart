apiVersion: v2
name: hyperdx-provider
description: >-
  Generates a HyperDX operator using the Krateo operator generator
  (oasgen-provider). Ships two RestDefinitions — Webhook and Alert — that
  oasgen-provider turns into managed CRDs + controllers (Webhook/Alert plus their
  *Configuration resources) driving the HyperDX REST API. This replaces the
  imperative obs-stack pod-restart-alert/*.sh scripts with declarative resources.
type: application
# 0.1.2: oasPath repointed from the unpinned observability-stack/main to a PINNED
# tag of the new krateo-hyperdx-provider source repo (post repo-split).
version: 0.1.2
appVersion: "2.27.0"
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateoplatformops/krateo/main/docs/media/logo.svg
keywords:
  - hyperdx
  - observability
  - krateo
  - oasgen-provider
sources:
  - https://github.com/krateo-blueprints/krateo-hyperdx-provider-chart
  - https://github.com/krateo-blueprints/krateo-hyperdx-provider
annotations:
  krateo.io/category: observability
  krateo.io/maturity: beta
  krateo.io/display-name: HyperDX Provider
  krateoSupportedVersion: ">= 2.5.1"
